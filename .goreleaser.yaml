# Builds every platform's binary, the archives install.sh downloads, and
# checksums.txt. The npm packages are published from dist/ afterwards by
# npm/publish.sh (.github/workflows/release.yml).
version: 2
project_name: judt

before:
  hooks:
    - go run ./internal/gen -check

builds:
  - id: judt
    main: ./cmd/judt
    binary: judt
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: judt
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Fixed names, so install.sh and `releases/latest/download/...` find them.
    name_template: "judt_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE*]

checksum:
  name_template: checksums.txt

release:
  extra_files:
    - glob: ./install.sh

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
