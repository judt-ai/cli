# Keeps the CLI in step with the API. Every hour, and when Core's production deploy
# sends `api-changed`, it downloads the published OpenAPI document and regenerates
# the commands. If anything changed it opens (or updates) one pull request. A new
# operation shows up there as a failing `gen -check` until commands.yaml names it.
name: spec-sync
on:
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [api-changed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: curl -fsSL https://api.judt.ai/api/openapi.json -o spec/openapi.json
      - name: Regenerate
        id: gen
        run: |
          go run ./internal/gen 2> gen.log || true
          cat gen.log
          {
            echo "problems<<EOF"
            cat gen.log
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          rm gen.log
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: spec-sync
          title: Sync with the API's OpenAPI document
          commit-message: Sync with the API's OpenAPI document
          body: |
            The published API (https://api.judt.ai/api/openapi.json) changed, and the
            commands are regenerated from it.

            ${{ steps.gen.outputs.problems && 'To do before merging (add each to commands.yaml):' || 'Nothing to name: flags and help changed only.' }}

            ```
            ${{ steps.gen.outputs.problems }}
            ```
