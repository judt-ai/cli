name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Fails when an API operation has no command in commands.yaml, an entry names
      # an operation that's gone, or operations_gen.go is out of date.
      - run: go run ./internal/gen -check
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o /tmp/judt ./cmd/judt && /tmp/judt --help >/dev/null
      - run: sh -n install.sh && sh -n npm/publish.sh
      # macOS's /bin/sh (bash 3.2) in a UTF-8 locale reads a non-ASCII byte right after a
      # variable as part of its name, and set -u then stops the script.
      - run: |
          perl -ne 'if (/[^\x00-\x7F]/) { print "$ARGV:$.: $_"; $bad = 1 } close ARGV if eof; END { exit($bad ? 1 : 0) }' install.sh npm/publish.sh
